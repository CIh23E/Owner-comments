<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Comments</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px; background: #090b10;
      color: #f1f5f9; font-family: Arial, sans-serif;
    }
    .container { max-width: 600px; margin: 35px auto; }
    .header {
      padding: 24px; background: #121722; border: 1px solid #293244;
      border-radius: 18px; margin-bottom: 18px;
    }
    .profile { color: #60a5fa; font-size: 13px; font-weight: bold; }
    h1 { margin: 12px 0 8px; }
    p { color: #9ca9bb; line-height: 1.5; }
    .panel {
      background: #121722; border: 1px solid #293244;
      padding: 18px; border-radius: 18px; margin-bottom: 18px;
    }
    input, textarea {
      display: block; width: 100%; padding: 13px; margin: 10px 0;
      color: white; background: #090e17; border: 1px solid #344056;
      border-radius: 10px; font: inherit;
    }
    textarea { min-height: 110px; resize: vertical; }
    button {
      width: 100%; padding: 14px; background: #3b82f6; color: white;
      border: 0; border-radius: 10px; font-weight: bold; font-size: 15px;
    }
    button:disabled { opacity: .6; }
    .comment {
      padding: 15px 0; border-bottom: 1px solid #293244;
      overflow-wrap: anywhere;
    }
    .comment:last-child { border-bottom: 0; }
    .comment-name { font-weight: bold; color: #93c5fd; }
    .comment-date { color: #778399; font-size: 12px; margin-top: 5px; }
    .message { white-space: pre-wrap; line-height: 1.6; margin-top: 10px; }
    a { color: #60a5fa; }
    #status { font-size: 13px; }
  </style>
</head>
<body>
  <main class="container">
    <section class="header">
      <div class="profile">● ONLINE COMMUNITY</div>
      <h1>Owner Comments</h1>
      <p>Tulis komentar lu di sini. Komentar yang dikirim bisa dibaca pengunjung lain.</p>
    </section>

    <section class="panel">
      <h3>Kirim komentar</h3>
      <form id="commentForm">
        <input id="name" maxlength="30" placeholder="Nama lu" required>
        <textarea id="message" maxlength="1000" placeholder="Tulis komentar atau tempel link di sini..." required></textarea>
        <button id="sendButton" type="submit">Kirim komentar ↗</button>
        <p id="status" role="status"></p>
      </form>
    </section>

    <section class="panel">
      <h3>💬 Komentar terbaru</h3>
      <div id="comments">Memuat komentar...</div>
    </section>
  </main>

  <script>
    const SUPABASE_URL = "https://hwguuwvkuprizpyrwriy.supabase.co";
    const SUPABASE_KEY = "sb_publishable_uH1A4H1q0p5P4g5TeCbUiA__oeeJV-Q";

    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const form = document.getElementById("commentForm");
    const nameInput = document.getElementById("name");
    const messageInput = document.getElementById("message");
    const statusText = document.getElementById("status");
    const sendButton = document.getElementById("sendButton");
    const commentsBox = document.getElementById("comments");

    function makeLink(text) {
      const fragment = document.createDocumentFragment();
      const regex = /https?:\/\/[^\s<]+/g;
      let lastIndex = 0;
      let match;

      while ((match = regex.exec(text)) !== null) {
        fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        const link = document.createElement("a");
        link.href = match[0];
        link.textContent = match[0];
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        fragment.appendChild(link);
        lastIndex = regex.lastIndex;
      }
      fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
      return fragment;
    }

    function renderComments(rows) {
      commentsBox.replaceChildren();
      if (!rows.length) {
        commentsBox.textContent = "Belum ada komentar. Jadilah yang pertama!";
        return;
      }

      rows.forEach((item) => {
        const card = document.createElement("article");
        card.className = "comment";
        const username = document.createElement("div");
        username.className = "comment-name";
        username.textContent = item.name;
        const message = document.createElement("div");
        message.className = "message";
        message.appendChild(makeLink(item.message));
        const date = document.createElement("div");
        date.className = "comment-date";
        date.textContent = new Date(item.created_at).toLocaleString("id-ID");
        card.append(username, message, date);
        commentsBox.appendChild(card);
      });
    }

    async function loadComments() {
      const { data, error } = await db
        .from("comments")
        .select("id, name, message, created_at")
        .order("created_at", { ascending: false })
        .limit(100);

      if (error) {
        commentsBox.textContent = "Gagal memuat komentar. Periksa koneksi dan pengaturan database.";
        console.error(error);
        return;
      }
      renderComments(data || []);
    }

    let sending = false;
    let lastSent = 0;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (sending) return;

      if (Date.now() - lastSent < 10000) {
        statusText.textContent = "Tunggu 10 detik sebelum mengirim lagi.";
        return;
      }

      const name = nameInput.value.trim();
      const message = messageInput.value.trim();
      if (!name || !message) {
        statusText.textContent = "Nama dan komentar wajib diisi.";
        return;
      }

      sending = true;
      sendButton.disabled = true;
      statusText.textContent = "Mengirim komentar...";
      const { error } = await db.from("comments").insert({ name, message });
      sending = false;
      sendButton.disabled = false;

      if (error) {
        statusText.textContent = "Gagal mengirim. Coba lagi dan periksa pengaturan database.";
        console.error(error);
        return;
      }

      lastSent = Date.now();
      messageInput.value = "";
      statusText.textContent = "Komentar berhasil dikirim! ✓";
      await loadComments();
    });

    loadComments();
    setInterval(loadComments, 15000);
  </script>
</body>
</html>
